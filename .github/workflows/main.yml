# http://docs.redisdesktop.com/en/latest/install/
# https://github.com/actions/virtual-environments/blob/master/images/win/Windows2019-Readme.md
# https://docs.github.com/en/free-pro-team@latest/actions/reference/workflow-syntax-for-github-actions

# This is a basic workflow to help you get started with Actions
name: CI for redis desktop manager

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the pre-release branch.
on:
  push:
    branches: [ pre-release ]
    paths-ignore: 
      - 'README.md'
      - 'LICENSE'
  pull_request:
    branches: [ pre-release ]
    paths-ignore: 
      - 'README.md'
      - 'LICENSE'
  # The weekly scheduled build is disabled: upstream code is frozen at the tip
  # of the 2022 branch, so there is nothing new to pick up. Uncomment the block
  # below (and drop workflow_dispatch) to bring the schedule back.
  # schedule:
  #   # https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#schedule
  #   - cron: '0 22 * * 6' # Runs at 22:00 UTC every saturday
  #
  # Build on demand from the Actions tab instead.
  workflow_dispatch:

env:
  RDM_REF: 2022
  VERSION: 2022.99.0
  PY_LIB_VERSION: 38
  PYTHON_EMBEDDED_VERSION: 3.8.10
  CMAKE_VS: Visual Studio 17 2022

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  create_release:
    # windows-2019 is retired by GitHub, which left this job queued for 24h and
    # then cancelled - blocking every build. This job only runs two actions, so
    # any runner image works.
    runs-on: ubuntu-latest
    # https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions#jobsjobs_idoutputs
    # Map a step output to a job output
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      # - name: checkout
      #   uses: actions/checkout@v2
      #   with:
      #     fetch-depth: 0

      # delete old release
      - uses: dev-drprasad/delete-tag-and-release@v0.2.1
        with:
          delete_release: true # default: false
          tag_name: ${{ env.RDM_REF }}-weekly # tag name to delete
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # This token is provided by Actions, you do not need to create your own token
        with:
          tag_name: ${{ env.RDM_REF }}-weekly
          release_name: v${{ env.RDM_REF }}-weekly
          body: |
            ${{ env.RDM_REF }}-weekly

            - macOS: Apple Silicon (arm64), requires macOS 15 or later
          draft: false
          prerelease: true

  build_on_windows:
    needs: create_release
    runs-on: windows-2022

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
    # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
    - uses: actions/checkout@v2
      with:
        repository: redis/RedisDesktopManager
        path: rdm
        submodules: 'recursive'
        ref: ${{ env.RDM_REF }}

    # install QT   
    - name: install QT
      uses: jurplel/install-qt-action@v4
      with: 
        version: '5.15.1'
        arch: 'win64_msvc2019_64'
        modules: 'qtcharts'

    - name: install zlib
      run: |
        cd rdm/3rdparty
        nuget install zlib-msvc14-x64 -Version 1.2.11.7795

    # from https://github.com/lework/RedisDesktopManager-Windows
    - name: build lz4
      run: |
        cd rdm/3rdparty/lz4/build/cmake
        cmake -G "${{ env.CMAKE_VS }}" -A x64 -DLZ4_BUNDLED_MODE=ON -DBUILD_SHARED_LIBS=ON -B .
        cmake --build . --config Release

    - name: build zstd
      run: |
        cd rdm/3rdparty/zstd/build/cmake
        cmake -G "${{ env.CMAKE_VS }}" -A x64 -B .
        cmake --build . --config Release

    - name: build snappy
      run: |
        cd rdm/3rdparty/snappy
        cmake -G "${{ env.CMAKE_VS }}" -A x64 -B .
        cmake --build . --config Release

    - name: build brotli
      run: |
        cd rdm/3rdparty/brotli
        cmake -G "${{ env.CMAKE_VS }}" -A x64 -B .
        cmake -DCMAKE_BUILD_TYPE=Release
        cmake --build . --config Release

#    # install python3  
#    - name: install Python3
#      uses: actions/setup-python@v2
#      with:
#        python-version: '3.7'
#        architecture: 'x64' # optional x64 or x86. Defaults to x64 if not specified

    # The app embeds Python 3.8 (python38.dll), so the bundled .pyc files and
    # the linked python38.lib have to be produced by 3.8 as well. windows-2022
    # no longer ships 3.8 in its tool cache, hence the explicit install.
    - name: setup python
      uses: actions/setup-python@v5
      with:
        python-version: '${{ env.PYTHON_EMBEDDED_VERSION }}'
        architecture: 'x64'

    # install python3
    - name: install python3
      shell: cmd
      run: mklink /d C:\Python${{ env.PY_LIB_VERSION }}-x64 C:\hostedtoolcache\windows\python\${{ env.PYTHON_EMBEDDED_VERSION }}\x64

    # pip install
    - name: pip install
      shell: cmd
      run: |
        cd rdm\build\windows\installer\resources
        xcopy %GITHUB_WORKSPACE%\rdm\src\py . /s /i
        mkdir Lib\site-packages
        pip3 install -t Lib\site-packages -r requirements.txt
        python -m compileall -b .
        del /s /q *.py
        forfiles /p "." /s /m __pycache__ /c "cmd /c if @isdir==TRUE rd /s /q @file 2>nul" 2>nul | exit /b 0
        forfiles /p "." /s /m *.dist-info /c "cmd /c if @isdir==TRUE rd /s /q @file 2>nul" 2>nul | exit /b 0
        forfiles /p "." /s /m *.egg-info /c "cmd /c if @isdir==TRUE rd /s /q @file 2>nul" 2>nul | exit /b 0

    # https://doc.qt.io/qt-5/linguist-manager.html
    # lupdate resp.pro
    - name: translations
      shell: cmd
      run: |
        cd rdm\src
        lupdate resp.pro
        lrelease -verbose resp.pro
        xcopy resources\translations\*.qm ..\build\windows\installer\resources\translations /s /i

    # Runs a single command using the runners shell
    - name: build
      shell: cmd
      env:
        vc_arch: x64
      run: |
        python rdm\build\utils\set_version.py ${{ env.VERSION }} > rdm\src\version.h
        cd rdm\src
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" %vc_arch%
        qmake resp.pro CONFIG-=debug "VERSION=${{ env.VERSION }}"
        nmake

    # 缺少python3.dll
    # fix formatter error, unicodedata _bz2
    - name: add python3.dll
      shell: powershell
#      env:
#        PYTHON_EMBEDDED_VERSION: ${{ env.PYTHON_EMBEDDED_VERSION }}
      run: |
        cd rdm\build\windows\installer\resources
        Invoke-WebRequest -Uri "https://www.python.org/ftp/python/${{ env.PYTHON_EMBEDDED_VERSION }}/python-${{ env.PYTHON_EMBEDDED_VERSION }}-embed-amd64.zip" -OutFile "python-embed.zip"
        7z.exe x python-embed.zip python${{ env.PY_LIB_VERSION }}.zip python3.dll python${{ env.PY_LIB_VERSION }}.dll unicodedata.pyd _bz2.pyd
        del python-embed.zip

    # windeployqt
    # https://doc.qt.io/qt-5/windows-deployment.html
    # windeployqt.exe --force --qmldir ${{ env.QML2_IMPORT_PATH }} resp.exe
    - name: package
      id: package
      shell: cmd
      run: |
        cd rdm
        copy /y bin\windows\release\resp.exe build\windows\installer\resources\resp.exe
        copy /y bin\windows\release\resp.exp build\windows\installer\resources\resp.exp
        copy /y bin\windows\release\resp.lib build\windows\installer\resources\resp.lib
        cd build\windows\installer\resources
        windeployqt.exe --no-angle --no-opengl-sw --no-compiler-runtime --no-translations --release --force --qmldir ../../../../src/qml resp.exe
        makensis.exe /V1 /DVERSION=${{ env.VERSION }} ../installer.nsi

    - name: Upload Release Asset
      id: upload-release-asset 
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        # upload_url: ${{ steps.create_release.outputs.upload_url }} # This pulls from the CREATE RELEASE step above, referencing it's ID to get its outputs object, which include a `upload_url`. See this blog post for more info: https://jasonet.co/posts/new-features-of-github-actions/#passing-data-to-future-steps 
        upload_url: ${{ needs.create_release.outputs.upload_url }}
        asset_path: rdm/build/windows/installer/resp-${{ env.VERSION }}.exe
        asset_name: resp-${{ env.VERSION }}.exe
        asset_content_type: application/vnd.microsoft.portable-executable

  build_on_osx:
    needs: create_release
    # Apple Silicon (arm64) runner.
    # macos-12/macos-13 (Intel) images are retired, and Apple is dropping x86_64
    # app support in upcoming macOS releases, so build for arm64 natively.
    runs-on: macos-15
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      # The embedded Python runtime (taken from the runner's Homebrew) requires
      # macOS 15, so that is the real floor of the produced app.
      MACOSX_DEPLOYMENT_TARGET: "15.0"

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
    # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
    - uses: actions/checkout@v2
      with:
        repository: redis/RedisDesktopManager
        path: rdm
        submodules: 'recursive'
        ref: ${{ env.RDM_REF }}

    # Qt 5 has no arm64 build for macOS: the official 5.15.x packages are
    # "clang_64" (x86_64 only), and linking them on Apple Silicon would silently
    # produce an Intel app. Homebrew ships a native arm64 Qt 5 with QtCharts.
    - name: install QT
      run: |
        brew install qt@5
        echo "$(brew --prefix qt@5)/bin" >> $GITHUB_PATH

    # pyotherside (the Python QML bridge) hardcodes the Intel-Homebrew path
    # /usr/local/bin/python3-config. On arm64 runners Homebrew lives in
    # /opt/homebrew, so without this the Python headers/libs are never found.
    - name: fix python config path
      run: |
        PYTHON_CONFIG="$(command -v python3-config || true)"
        if [ -z "$PYTHON_CONFIG" ]; then
          PYTHON_CONFIG="$(python3 -c 'import sysconfig;print(sysconfig.get_config_var("BINDIR"))')/python3-config"
        fi
        echo "using ${PYTHON_CONFIG}"
        sed -i '' "s|/usr/local/bin/python3-config|${PYTHON_CONFIG}|" rdm/3rdparty/pyotherside.pri
        grep -n "PYTHON_CONFIG = " rdm/3rdparty/pyotherside.pri

    # CMAKE_POLICY_VERSION_MINIMUM: CMake 4 dropped support for the
    # `cmake_minimum_required(VERSION 2.x)` used by these vendored projects.
    # lz4/zstd/snappy/brotli are linked as static archives (see 3rdparty.pri),
    # and are built straight from their in-tree build dirs, so no `install`.
    - name: build lz4
      run: |
        cd rdm/3rdparty/lz4/build/cmake
        cmake -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DLZ4_BUNDLED_MODE=ON -DBUILD_SHARED_LIBS=OFF .
        ls
        make -s -j$(sysctl -n hw.ncpu)

    - name: build zstd
      run: |
        cd rdm/3rdparty/zstd/build/cmake
        cmake -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DZSTD_BUILD_SHARED=OFF . && make -s -j$(sysctl -n hw.ncpu)

    - name: build snappy
      run: |
        cd rdm/3rdparty/snappy
        cmake -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DSNAPPY_BUILD_TESTS=OFF -DSNAPPY_BUILD_BENCHMARKS=OFF . && make -s -j$(sysctl -n hw.ncpu)

    - name: build brotli
      run: |
        cd rdm/3rdparty/brotli
        cmake -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF .
        make -s -j$(sysctl -n hw.ncpu)

    - name: copy info.plist
      run: |
        cd rdm/src/resources
        cp ./Info.plist.sample ./Info.plist
        # Declare the real minimum so macOS refuses to start the app with a
        # readable message instead of a dyld error.
        /usr/libexec/PlistBuddy -c "Set :LSMinimumSystemVersion ${MACOSX_DEPLOYMENT_TARGET}" ./Info.plist
        /usr/libexec/PlistBuddy -c "Print :LSMinimumSystemVersion" ./Info.plist

    - name: pip install
      run: |
        cd rdm
        mkdir -p bin/osx/release && cd bin/osx/release
        cp -Rf $GITHUB_WORKSPACE/rdm/src/py .
        cd py
        echo six >> requirements.txt
        pip3 install -t . -r requirements.txt
        python3 -m compileall -b .
        find . -name "*.py" | xargs rm -rf
        find . -name "__pycache__" | xargs rm -rf
        find . -name "*.dist-info" | xargs rm -rf
        find . -name "*.egg-info" | xargs rm -rf

    - name: release translations
      run: |
        cd rdm/src
        lupdate resp.pro
        lrelease -verbose resp.pro

    # macdeployqt
    # https://doc.qt.io/qt-5/macos-deployment.html
    - name: build
      id: build
      run: |
        cd rdm/src
        qmake resp.pro CONFIG-=debug "VERSION=${{ env.VERSION }}" "QMAKE_MACOSX_DEPLOYMENT_TARGET=${{ env.MACOSX_DEPLOYMENT_TARGET }}"
        make -s -j$(sysctl -n hw.ncpu)

    - name: copy translations
      run: |
        cd rdm/src
        mkdir -p ../bin/osx/release/RESP.app/Contents/translations
        cp -f ./resources/translations/*.qm ../bin/osx/release/RESP.app/Contents/translations

    # Note: the DMG is created in a later step, after the app has been signed -
    # `macdeployqt -dmg` would embed an unsigned app.
    - name: package
      id: package
      run: |
        cd rdm/bin/osx/release
        zip -q -r release.zip .
        cp -Rf py ./RESP.app/Contents/Resources/
        python_version=$(python3 -c "import sys; print('.'.join(map(str, sys.version_info[:2])))")
        echo ${python_version}
        python_framework_prefix=$(python3 -c "import sysconfig; print(sysconfig.get_config_var('PYTHONFRAMEWORKPREFIX') or '')")
        test -n "${python_framework_prefix}" || { echo "python3 is not a framework build"; exit 1; }
        mkdir -p ./RESP.app/Contents/Frameworks
        cp -Rf "${python_framework_prefix}/Python.framework" ./RESP.app/Contents/Frameworks/
        python_lib=$(otool -L ./RESP.app/Contents/MacOS/RESP | awk '/Python\.framework/ {print $1; exit}')
        echo "rewriting ${python_lib}"
        install_name_tool -change "${python_lib}" "@rpath/Python.framework/Versions/${python_version}/Python" ./RESP.app/Contents/MacOS/RESP
        otool -L ./RESP.app/Contents/MacOS/RESP
        macdeployqt ./RESP.app -qmldir=../../../src/qml -always-overwrite

    # Apple Silicon refuses to launch unsigned binaries, and both
    # install_name_tool and macdeployqt invalidate the existing signature, so
    # the bundle has to be signed again before it is shipped.
    - name: codesign
      run: |
        cd rdm/bin/osx/release
        test "$(lipo -archs RESP.app/Contents/MacOS/RESP)" = "arm64"
        find RESP.app/Contents -type f -name "*.dylib" -print0 | xargs -0 -n1 codesign --force --sign -
        find RESP.app/Contents -type d -name "*.framework" -print0 | xargs -0 -n1 codesign --force --sign -
        codesign --force --sign - RESP.app
        codesign -v RESP.app

    - name: create dmg
      run: |
        cd rdm/bin/osx/release
        rm -rf dmg-root && mkdir dmg-root
        cp -R RESP.app dmg-root/RESP.app
        ln -s /Applications dmg-root/Applications
        hdiutil create -volname RESP -srcfolder dmg-root -ov -format UDZO RESP.dmg
        lipo -info RESP.app/Contents/MacOS/RESP
        codesign -v RESP.app

    - name: Upload Release Asset
      id: upload-release-asset 
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ needs.create_release.outputs.upload_url }}
        asset_path: rdm/bin/osx/release/RESP.dmg
        asset_name: RESP.dmg
        asset_content_type: application/dmg
